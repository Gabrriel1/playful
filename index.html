
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#030704">
  <title>Welcome | PlayfulRewards</title>
  <link rel="icon" href="/playfulrewards-logo.png" type="image/png">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #030704;
      --card: #0b1710;
      --green: #39ff88;
      --green2: #20d66b;
      --text: #f5fff7;
      --muted: #a7b8ab;
      --yellow: #ffd56a;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      font-family: -apple-system, BlinkMacSystemFont,
        "Segoe UI", system-ui, sans-serif;
      color: var(--text);
      background:
        radial-gradient(
          circle at 50% -10%,
          rgba(57,255,136,.35),
          transparent 35%
        ),
        radial-gradient(
          circle at 100% 25%,
          rgba(255,213,106,.16),
          transparent 28%
        ),
        linear-gradient(
          180deg,
          #06140b 0%,
          #030704 65%,
          #020302 100%
        );
    }

    .card {
      width: 100%;
      max-width: 440px;
      padding: 36px 24px 30px;
      text-align: center;
      border: 1px solid rgba(57,255,136,.22);
      border-radius: 28px;
      background:
        radial-gradient(
          circle at 50% 20%,
          #143322 0%,
          #07150c 45%,
          #030704 100%
        );
      box-shadow: 0 24px 70px rgba(0,0,0,.55);
    }

    .logo-wrap {
      width: 82px;
      height: 82px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 24px;
      padding: 10px;
      border-radius: 24px;
      background: linear-gradient(180deg, #67ffa3, #20d66b);
      box-shadow: 0 16px 36px rgba(57,255,136,.28);
    }

    .logo {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .brand {
      margin-bottom: 28px;
      color: var(--green);
      font-size: 19px;
      font-weight: 900;
      letter-spacing: -.5px;
    }

    h1 {
      margin-bottom: 14px;
      font-size: clamp(30px, 8vw, 40px);
      line-height: 1.08;
      letter-spacing: -1.6px;
    }

    h1 span {
      color: var(--green);
      text-shadow: 0 0 24px rgba(57,255,136,.2);
    }

    .description {
      margin-bottom: 28px;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.6;
    }

    .buttons {
      display: grid;
      gap: 12px;
    }

    .btn {
      display: flex;
      min-height: 62px;
      align-items: center;
      justify-content: center;
      padding: 15px 18px;
      border-radius: 18px;
      font-size: 15px;
      font-weight: 900;
      text-align: center;
      text-decoration: none;
      -webkit-tap-highlight-color: transparent;
      transition: transform .15s ease, filter .15s ease;
    }

    .btn:active {
      transform: scale(.98);
    }

    .yes {
      color: #031108;
      background: linear-gradient(180deg, #67ffa3, #20d66b);
      box-shadow: 0 16px 30px rgba(32,214,107,.24);
    }

    .no {
      color: #e8f3eb;
      background: rgba(255,255,255,.07);
      border: 1px solid rgba(255,255,255,.10);
    }

    .footer {
      margin-top: 22px;
      color: #718477;
      font-size: 11px;
      line-height: 1.6;
    }
  </style>
</head>

<body>
  <main class="card">
    <div class="logo-wrap">
      <img
        class="logo"
        src="/playfulrewards-logo.png"
        alt="PlayfulRewards logo"
      >
    </div>

    <div class="brand">PlayfulRewards</div>

    <h1>How old <span>are you?</span></h1>

    <p class="description">
      Please confirm your age to continue to PlayfulRewards.
    </p>

    <div class="buttons">
      <a
        class="btn yes"
        href="https://playful-9s6.pages.dev/home/"
      >
        I'm 21 or older
      </a>

      <a
        class="btn no"
        href="https://playful-9s6.pages.dev/home/"
      >
        I'm under 21
      </a>
    </div>

    <p class="footer">
      Welcome to PlayfulRewards
    </p>
  </main>
</body>
</html>
