```html
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Welcome | PlayfulRewards</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #f5fff7;
      background:
        radial-gradient(circle at 50% 10%, rgba(57,255,136,.22), transparent 38%),
        linear-gradient(180deg, #07150c, #030704 75%);
    }

    .card {
      width: 100%;
      max-width: 440px;
      padding: 38px 24px;
      text-align: center;
      border: 1px solid rgba(57,255,136,.2);
      border-radius: 28px;
      background: rgba(11,23,16,.96);
      box-shadow: 0 24px 70px rgba(0,0,0,.45);
    }

    .icon {
      width: 82px;
      height: 82px;
      display: grid;
      place-items: center;
      margin: 0 auto 24px;
      border-radius: 24px;
      background: linear-gradient(180deg, #67ffa3, #20d66b);
      color: #031108;
      font-size: 25px;
      font-weight: 900;
    }

    h1 {
      margin-bottom: 14px;
      font-size: clamp(28px, 7vw, 38px);
      line-height: 1.1;
      letter-spacing: -1.5px;
    }

    p {
      margin-bottom: 28px;
      color: #a7b8ab;
      font-size: 15px;
      line-height: 1.6;
    }

    .buttons {
      display: grid;
      gap: 12px;
    }

    .btn {
      display: flex;
      min-height: 60px;
      align-items: center;
      justify-content: center;
      padding: 14px 18px;
      border: 0;
      border-radius: 16px;
      font-size: 15px;
      font-weight: 800;
      text-decoration: none;
      cursor: pointer;
      transition: transform .15s ease, filter .15s ease;
    }

    .btn:active { transform: scale(.98); }

    .yes {
      color: #031108;
      background: linear-gradient(180deg, #67ffa3, #20d66b);
    }

    .no {
      color: #f5fff7;
      background: rgba(255,255,255,.07);
      border: 1px solid rgba(255,255,255,.12);
    }

    .note {
      margin-top: 20px;
      margin-bottom: 0;
      font-size: 12px;
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="icon">21+</div>

    <h1>How old are you?</h1>

    <p>Please confirm your age to continue to PlayfulRewards.</p>

    <div class="buttons">
      <a class="btn yes" href="/home/">I'm 21 or older</a>
      <a class="btn no" href="/home/">I'm under 21</a>
    </div>

    <p class="note">Select an option to continue.</p>
  </main>
</body>
</html>
```
