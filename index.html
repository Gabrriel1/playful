
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#080018">
  <title>Welcome | PlayfulRewards</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --text: #ffffff;
      --muted: #c8c3ef;
      --gold: #ffd84d;
      --line: rgba(255,255,255,.13);
      --font: -apple-system, BlinkMacSystemFont,
        "Segoe UI", system-ui, sans-serif;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      color: var(--text);
      font-family: var(--font);
      -webkit-font-smoothing: antialiased;
      background:
        radial-gradient(
          circle at 18% 0%,
          rgba(255,216,77,.22),
          transparent 26%
        ),
        radial-gradient(
          circle at 82% 8%,
          rgba(255,61,242,.20),
          transparent 30%
        ),
        radial-gradient(
          circle at 50% 10%,
          rgba(123,44,255,.45),
          transparent 42%
        ),
        linear-gradient(
          180deg,
          #080018 0%,
          #120044 48%,
          #060012 100%
        );
    }

    .card {
      width: 100%;
      max-width: 440px;
      padding: 42px 24px 32px;
      text-align: center;
      border: 1px solid var(--line);
      border-radius: 28px;
      background: linear-gradient(
        180deg,
        rgba(255,255,255,.13),
        rgba(255,255,255,.06)
      );
      box-shadow:
        0 20px 50px rgba(0,0,0,.35),
        inset 0 1px 0 rgba(255,255,255,.16);
    }

    h1 {
      margin-bottom: 14px;
      font-size: clamp(32px, 8vw, 42px);
      line-height: 1.08;
      letter-spacing: -1.6px;
    }

    h1 span {
      color: var(--gold);
      text-shadow: 0 0 22px rgba(255,216,77,.32);
    }

    .description {
      margin-bottom: 28px;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.6;
    }

    .buttons {
      display: grid;
      gap: 12px;
    }

    .btn {
      display: flex;
      width: 100%;
      min-height: 62px;
      align-items: center;
      justify-content: center;
      padding: 15px 18px;
      border-radius: 18px;
      font-size: 15px;
      font-weight: 900;
      text-align: center;
      text-decoration: none;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      transition: transform .15s ease, filter .15s ease;
    }

    .btn:active {
      transform: scale(.98);
    }

    .yes {
      color: #1b0a00;
      background: linear-gradient(
        180deg,
        #ffe36d,
        #ffb300
      );
      box-shadow:
        0 16px 30px rgba(255,179,0,.24),
        inset 0 1px 0 rgba(255,255,255,.55);
    }

    .yes:hover {
      filter: brightness(1.05);
    }

    .no {
      color: #f2edff;
      background: rgba(255,255,255,.075);
      border: 1px solid var(--line);
    }

    .no:hover {
      background: rgba(255,255,255,.12);
    }

    @media (max-width: 360px) {
      .card {
        padding: 34px 18px 26px;
      }

      h1 {
        font-size: 32px;
      }
    }
  </style>
</head>

<body>
  <main class="card">

    <h1>
      How old <span>are you?</span>
    </h1>

    <p class="description">
      Please confirm your age to continue.
    </p>

    <div class="buttons">

      <a
        class="btn yes"
        href="https://playful-9s6.pages.dev/home/"
      >
        I'm 21 or older
      </a>

      <a
        class="btn no"
        href="https://playful-9s6.pages.dev/home/"
      >
        I'm under 21
      </a>

    </div>

  </main>
</body>
</html>
